name: Browser E2E

# Split out of ci.yml: Playwright's Chromium install + a real browser run add several minutes CI
# doesn't need on every push/PR — this workflow exists so an agent (or a human) driving the fast
# CI loop never has to sit through it. Runs on:
#   - workflow_dispatch: a manual trigger, any time.
#   - pull_request/push to main, but only when the changed paths could plausibly affect what this
#     suite actually runs — see each path's own comment below for why it's here. NOT included:
#     apps/api/** (this suite never talks to it at all — see e2e/config.ts's own WEB_API_PORT
#     comment: nothing listens there on purpose), game-registry/** (the two synthetic games this
#     suite's own fixture registers never touch game-registry/ — see
#     e2e/prepareLocalGameOrigin.ts's own doc comment — and for the four real SYSTEM games the
#     harness reads the already-committed packages/core/**/*.generated.ts output, never
#     regenerates it; a game-registry/ edit with no matching regen is exactly what
#     `pnpm registry:check`, in the fast CI workflow, already exists to catch), and scripts/** as
#     a whole (only four specific files under it are ever actually imported/executed by this
#     pipeline, listed individually below).
#
# Deploy (deploy.yml) is gated on the "CI" workflow only, not this one — production's own
# post-deploy "Smoke Test Web Frontend & Provenance" step is the safety net that still runs on
# every deploy; this suite is a slower, parallel signal on top of that, not a merge/deploy gate.

on:
  workflow_dispatch: {}
  pull_request:
    branches: [main]
    paths: &e2e-relevant-paths
      # The app this suite actually builds and drives via Playwright — pnpm --filter @owogg/web
      # build is a single Vite build of the whole app, so any file under here is a real build-time
      # dependency, not just the game-related routes/components.
      - "apps/web/**"
      # apps/web's build dynamically imports all four (GAME_LOADERS in
      # gameLoaders.generated.ts), which Vite resolves and bundles at build time regardless of
      # this suite's own fixture never touching a real game — a broken aim-test/memory-test/
      # typing-test/reaction-time would fail that build too.
      - "games/**"
      # Every package here is a real, verified dependency: contracts/core/game-sdk/shared/ui are
      # all direct deps of apps/web; core is also imported directly by
      # prepareLocalGameOrigin.ts (sha256Hex, GAME_MANIFESTS); db is pulled in transitively the
      # moment that same file imports writeReleaseMap from
      # scripts/official-game-bundle-publisher.ts, which imports BackblazeB2GameBundleRepository
      # at module load time even though this harness never calls it.
      - "packages/**"
      # The harness itself — prepare/run scripts, Playwright config, fixtures/, the spec files.
      - "e2e/**"
      # The exact four scripts/ files this pipeline actually imports/executes, not the whole
      # directory: official-game-bundle-publisher.ts (writeReleaseMap — see
      # prepareLocalGameOrigin.ts), registry-builder.ts (renderCoreRegistryModule — same file,
      # same reason: this is how the two synthetic E2E-only games get appended to a *temporary*
      # copy of the real registry without a hand-written second template), and
      # prepare-web-build.ts/post-web-build.ts (apps/web's own "build" script runs both around
      # react-router build).
      - "scripts/official-game-bundle-publisher.ts"
      - "scripts/registry-builder.ts"
      - "scripts/prepare-web-build.ts"
      - "scripts/post-web-build.ts"
      - "pnpm-lock.yaml"
      - ".github/workflows/e2e.yml"
  push:
    branches: [main]
    paths: *e2e-relevant-paths

jobs:
  e2e:
    # Pinned rather than ubuntu-latest specifically because this job now depends on the runner
    # image shipping a system Google Chrome (see e2e/playwright.config.ts's own `channel: "chrome"`
    # doc comment) — ubuntu-latest silently moving to an image that dropped it would break this
    # job with no diff in this repo to point at. ubuntu-24.04 is confirmed to ship Chrome stable.
    runs-on: ubuntu-24.04
    # The install step this used to wait on (`playwright install --with-deps chromium`) was the
    # actual bottleneck — it could stall for 10+ minutes on the runner's apt mirror before the
    # real test (a couple of seconds) even started. There is no longer a browser/OS-dependency
    # install step at all (see below), so a real run finishing in a couple of minutes and a hang
    # both become obvious well within this budget instead of silently eating CI time.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runs entirely against a local fixture — no production B2, no play.owogg.com/owogg.com —
      # see e2e/prepareLocalGameOrigin.ts and e2e/run.ts's own doc comments for how. Uses the
      # runner's own preinstalled Chrome (playwright.config.ts's `channel: "chrome"`), so there is
      # deliberately no `playwright install` step here — see that config's own doc comment for why.
      - name: Browser E2E
        run: pnpm e2e
