name: Browser E2E

# Split out of ci.yml: Playwright's Chromium install + a real browser run add several minutes CI
# doesn't need on every push/PR — this workflow exists so an agent (or a human) driving the fast
# CI loop never has to sit through it. Runs on:
#   - workflow_dispatch: a manual trigger, any time.
#   - pull_request/push to main, but only when the changed paths could plausibly affect what this
#     suite actually runs — see each path's own comment below for why it's here. NOT included:
#     apps/api/** (this suite never talks to it at all — see e2e/config.ts's own WEB_API_PORT
#     comment: nothing listens there on purpose), game-registry/** (the harness reads the
#     already-committed packages/core/**/*.generated.ts output, never regenerates it — a
#     game-registry/ edit with no matching regen is exactly what `pnpm registry:check`, in the
#     fast CI workflow, already exists to catch), and scripts/** as a whole (only three specific
#     files under it are ever actually imported/executed by this pipeline, listed individually
#     below — the registry generator, the architecture guard, and every other script here run
#     nowhere near this suite).
#
# Deploy (deploy.yml) is gated on the "CI" workflow only, not this one — production's own
# post-deploy "Smoke Test Web Frontend & Provenance" step is the safety net that still runs on
# every deploy; this suite is a slower, parallel signal on top of that, not a merge/deploy gate.

on:
  workflow_dispatch: {}
  pull_request:
    branches: [main]
    paths: &e2e-relevant-paths
      # The app this suite actually builds and drives via Playwright — pnpm --filter @owogg/web
      # build is a single Vite build of the whole app, so any file under here is a real build-time
      # dependency, not just the game-related routes/components.
      - "apps/web/**"
      # apps/web's build dynamically imports all four (GAME_LOADERS in
      # gameLoaders.generated.ts), which Vite resolves and bundles at build time regardless of
      # which one Playwright actually clicks through — a broken aim-test/memory-test/typing-test
      # would fail that build too, not just reaction-time's own standalone bundle.
      - "games/**"
      # Every package here is a real, verified dependency: contracts/core/game-sdk/shared/ui are
      # all direct deps of apps/web (and core/game-sdk/shared/ui of reaction-time too); db is
      # pulled in transitively the moment prepareLocalGameOrigin.ts imports anything from
      # scripts/official-game-bundle-publisher.ts, which imports BackblazeB2GameBundleRepository
      # at module load time even though this harness never calls it.
      - "packages/**"
      # The harness itself — prepare/run scripts, Playwright config, the one spec file.
      - "e2e/**"
      # The exact three scripts/ files this pipeline actually runs, not the whole directory:
      # official-game-bundle-publisher.ts (imported by prepareLocalGameOrigin.ts to build+hash
      # the local reaction-time fixture) and prepare-web-build.ts/post-web-build.ts (apps/web's
      # own "build" script runs both around react-router build).
      - "scripts/official-game-bundle-publisher.ts"
      - "scripts/prepare-web-build.ts"
      - "scripts/post-web-build.ts"
      - "pnpm-lock.yaml"
      - ".github/workflows/e2e.yml"
  push:
    branches: [main]
    paths: *e2e-relevant-paths

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Chromium only (see e2e/playwright.config.ts's own doc comment for why one engine is
      # enough for what this suite actually checks) — `--with-deps` additionally installs the
      # OS-level libraries a real Chromium needs to launch headless on a bare Ubuntu runner.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Runs entirely against a local fixture — no production B2, no play.owogg.com/owogg.com —
      # see e2e/prepareLocalGameOrigin.ts and e2e/run.ts's own doc comments for how.
      - name: Browser E2E
        run: pnpm e2e
