name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Architecture Check
        run: pnpm architecture:check

      - name: Registry Freshness Check
        run: pnpm registry:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # `pnpm test` is `turbo test`, which only runs the `test` script of each *workspace* package
      # (apps/*, packages/*, games/*). scripts/ is not a workspace member, so its tests — the
      # architecture guard's own, and the registry generator's — had no runner at all and were
      # silently never executed. A guard whose tests don't run is how the previous line-based
      # import matcher degraded unnoticed; this is the step that keeps that from repeating.
      - name: Test build scripts
        run: pnpm test:scripts

      - name: Build
        run: pnpm build
