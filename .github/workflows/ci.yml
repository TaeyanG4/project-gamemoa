name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Check
        run: pnpm format:check

      - name: Documentation Check
        run: pnpm docs:check

      - name: Lint
        run: pnpm lint

      - name: Architecture Check
        run: pnpm architecture:check

      - name: Typecheck
        run: pnpm typecheck

      # `pnpm typecheck` is `turbo typecheck`, which only reaches workspace packages. scripts/ is
      # not one, so the architecture guard would otherwise be unchecked — and its
      # tests run under tsx, which strips types without checking them.
      - name: Typecheck build scripts
        run: pnpm typecheck:scripts

      - name: Test
        run: pnpm test

      # `pnpm test` is `turbo test`, which only runs the `test` script of each *workspace* package
      # (apps/*, packages/*). scripts/ is not a workspace member, so its tests — the
      # architecture guard's own — had no runner at all and were
      # silently never executed. A guard whose tests don't run is how the previous line-based
      # import matcher degraded unnoticed; this is the step that keeps that from repeating.
      - name: Test build scripts
        run: pnpm test:scripts

      - name: Build
        run: pnpm build

      # Browser E2E (Playwright) is a separate workflow (.github/workflows/e2e.yml) — Chromium
      # install + a real browser run add several minutes this fast feedback loop doesn't need on
      # every push/PR. See that workflow's own doc comment for when it runs instead.

  deploy-staging:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/staging' }}
    needs: ci
    permissions:
      contents: read
    # The called job selects the `staging` Environment. Reusable workflows still require the
    # caller to forward its available secrets; without this, Environment vars resolve but every
    # Environment secret is an empty string and the fail-closed preflight stops before deploy.
    secrets: inherit
    uses: ./.github/workflows/deploy-staging.yml
