name: Deploy to Cloudflare

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

concurrency:
  group: gamemoa-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Production
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}

    steps:
      - name: Checkout exact tested SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply D1 Migrations to Production
        run: pnpm d1:migrate:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy API Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: deploy

      - name: Verify API Health
        run: |
          node -e "
            fetch('https://gamemoa-api.gamemoa.workers.dev/api/health')
              .then(res => {
                if (!res.ok) process.exit(1);
                return res.json();
              })
              .then(data => {
                if (data.status !== 'ok') process.exit(1);
                console.log('API Health Check Passed:', data);
              })
              .catch(err => {
                console.error(err);
                process.exit(1);
              });
          "

      - name: Build Web Frontend
        run: pnpm --filter @gamemoa/web build

      - name: Deploy Web Frontend
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: deploy

      - name: Smoke Test Web Frontend
        run: |
          node -e "
            const routes = ['/', '/games', '/ranking', '/profile', '/games/reaction-time', '/games/memory-test'];
            Promise.all(routes.map(r => 
              fetch('https://gamemoa-web.gamemoa.workers.dev' + r + '?v=' + Date.now())
                .then(res => {
                  console.log(r, res.status, res.headers.get('content-type'));
                  if (!res.ok) throw new Error('Route failed: ' + r);
                })
            )).then(() => console.log('Web Smoke Tests Passed!'))
            .catch(err => { console.error(err); process.exit(1); });
          "
