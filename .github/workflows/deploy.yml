name: Deploy to Cloudflare

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

concurrency:
  group: gamemoa-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Production
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}

    steps:
      - name: Checkout exact tested SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply D1 Migrations to Production
        run: pnpm d1:migrate:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy API Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: deploy --var COMMIT_SHA:${{ github.event.workflow_run.head_sha }}

      - name: Verify API Health & Provenance
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          node -e "
            const expectedSha = process.env.EXPECTED_SHA;
            fetch('https://gamemoa-api.gamemoa.workers.dev/api/health')
              .then(res => {
                if (!res.ok) throw new Error('API Health Endpoint Failed: ' + res.status);
                return res.json();
              })
              .then(data => {
                console.log('API Health Response:', data);
                if (data.status !== 'ok') throw new Error('API status is not ok');
                if (expectedSha && data.commit !== expectedSha) {
                  throw new Error('API SHA Mismatch! Expected: ' + expectedSha + ', Deployed: ' + data.commit);
                }
                console.log('✅ API Health & Provenance Verification Passed!');
              })
              .catch(err => {
                console.error(err);
                process.exit(1);
              });
          "

      - name: Build Web Frontend
        run: pnpm --filter @gamemoa/web build
        env:
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}

      - name: Deploy Web Frontend
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: deploy

      - name: Smoke Test Web Frontend & Provenance
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          node -e "
            const expectedSha = process.env.EXPECTED_SHA;
            fetch('https://gamemoa-web.gamemoa.workers.dev/version.json?v=' + Date.now())
              .then(res => {
                if (!res.ok) throw new Error('version.json fetch failed: ' + res.status);
                return res.json();
              })
              .then(data => {
                console.log('Web Version Response:', data);
                if (expectedSha && data.commit !== expectedSha) {
                  throw new Error('Web SHA Mismatch! Expected: ' + expectedSha + ', Deployed: ' + data.commit);
                }
              })
              .then(() => {
                const routes = ['/', '/games', '/ranking', '/profile', '/games/reaction-time', '/games/memory-test', '/games/aim-test'];
                return Promise.all(routes.map(r => 
                  fetch('https://gamemoa-web.gamemoa.workers.dev' + r + '?v=' + Date.now())
                    .then(res => {
                      console.log(r, res.status);
                      if (!res.ok) throw new Error('Route failed: ' + r);
                    })
                ));
              })
              .then(() => console.log('✅ Web Smoke & Provenance Verification Passed!'))
              .catch(err => { console.error(err); process.exit(1); });
          "
