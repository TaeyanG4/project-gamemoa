name: Deploy to Cloudflare

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

concurrency:
  group: gamemoa-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Production
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}

    steps:
      - name: Checkout exact tested SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply D1 Migrations to Production
        run: pnpm d1:migrate:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy API Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          # Creator provider client IDs/redirect URIs are non-secret and optional — GAMEMOA must
          # still deploy when some (or all) are unconfigured (`|| ''`). Client secrets/API keys go
          # through `secrets:` below, never `--var`.
          command: >-
            deploy
            --var COMMIT_SHA:${{ github.event.workflow_run.head_sha }}
            GOOGLE_CLIENT_ID:${{ vars.GOOGLE_CLIENT_ID }}
            DISCORD_CLIENT_ID:${{ vars.DISCORD_CLIENT_ID }}
            DISCORD_REDIRECT_URI:${{ vars.DISCORD_REDIRECT_URI }}
            DISCORD_PUBLIC_KEY:${{ vars.DISCORD_PUBLIC_KEY }}
            DISCORD_INSTALL_URL:${{ vars.DISCORD_INSTALL_URL || '' }}
            FRONTEND_URL:${{ vars.FRONTEND_URL }}
            ADMIN_USER_IDS:${{ vars.ADMIN_USER_IDS || '' }}
            ADMIN_LOGIN_USERNAME:${{ vars.ADMIN_LOGIN_USERNAME || '' }}
            CREATOR_ENABLED_PROVIDERS:${{ vars.CREATOR_ENABLED_PROVIDERS || '' }}
            YOUTUBE_CLIENT_ID:${{ vars.YOUTUBE_CLIENT_ID || '' }}
            YOUTUBE_REDIRECT_URI:${{ vars.YOUTUBE_REDIRECT_URI || '' }}
            TWITCH_CLIENT_ID:${{ vars.TWITCH_CLIENT_ID || '' }}
            TWITCH_REDIRECT_URI:${{ vars.TWITCH_REDIRECT_URI || '' }}
            CHZZK_CLIENT_ID:${{ vars.CHZZK_CLIENT_ID || '' }}
            CHZZK_REDIRECT_URI:${{ vars.CHZZK_REDIRECT_URI || '' }}
            SOOP_CLIENT_ID:${{ vars.SOOP_CLIENT_ID || '' }}
            SOOP_REDIRECT_URI:${{ vars.SOOP_REDIRECT_URI || '' }}
          secrets: |
            DISCORD_CLIENT_SECRET
            YOUTUBE_CLIENT_SECRET
            YOUTUBE_API_KEY
            TWITCH_CLIENT_SECRET
            CHZZK_CLIENT_SECRET
            SOOP_CLIENT_SECRET
            ADMIN_GOOGLE_SUBS
            ADMIN_PASSWORD_PBKDF2
        env:
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          # Optional Creator provider secrets. An unset GitHub secret resolves to an empty
          # string, which keeps that provider's isConfigured() false — never
          # USE_MOCK_CREATOR_PROVIDERS, which this workflow never sets.
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          CHZZK_CLIENT_SECRET: ${{ secrets.CHZZK_CLIENT_SECRET }}
          SOOP_CLIENT_SECRET: ${{ secrets.SOOP_CLIENT_SECRET }}
          # Admin step-up identity data — sensitive operational config, never a Variable.
          ADMIN_GOOGLE_SUBS: ${{ secrets.ADMIN_GOOGLE_SUBS }}
          # PBKDF2-derived record only (see `pnpm admin:password:hash`) — never the plaintext password.
          ADMIN_PASSWORD_PBKDF2: ${{ secrets.ADMIN_PASSWORD_PBKDF2 }}

      - name: Verify API Health & Provenance
        run: pnpm smoke:prod --api-only --sha ${{ github.event.workflow_run.head_sha }}
        env:
          CREATOR_ENABLED_PROVIDERS: ${{ vars.CREATOR_ENABLED_PROVIDERS || '' }}

      - name: Build Web Frontend
        run: pnpm --filter @gamemoa/web build
        env:
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://gamemoa-api.gamemoa.workers.dev' }}

      - name: Deploy Web Frontend
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: deploy

      - name: Smoke Test Web Frontend & Provenance
        run: pnpm smoke:prod --sha ${{ github.event.workflow_run.head_sha }}
