name: Deploy to Cloudflare

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

concurrency:
  group: gamemoa-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Production
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}

    steps:
      - name: Checkout exact tested SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply D1 Migrations to Production
        run: pnpm d1:migrate:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy API Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: deploy --var COMMIT_SHA:${{ github.event.workflow_run.head_sha }} GOOGLE_CLIENT_ID:${{ vars.GOOGLE_CLIENT_ID }} DISCORD_CLIENT_ID:${{ vars.DISCORD_CLIENT_ID }} DISCORD_REDIRECT_URI:${{ vars.DISCORD_REDIRECT_URI }} DISCORD_PUBLIC_KEY:${{ vars.DISCORD_PUBLIC_KEY }} FRONTEND_URL:${{ vars.FRONTEND_URL }}
          secrets: |
            DISCORD_CLIENT_SECRET
        env:
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}

      - name: Verify API Health & Provenance
        run: pnpm smoke:prod --api-only --sha ${{ github.event.workflow_run.head_sha }}

      - name: Build Web Frontend
        run: pnpm --filter @gamemoa/web build
        env:
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://gamemoa-api.gamemoa.workers.dev' }}

      - name: Deploy Web Frontend
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: deploy

      - name: Smoke Test Web Frontend & Provenance
        run: pnpm smoke:prod --sha ${{ github.event.workflow_run.head_sha }}
