<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="OwOGG">
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1" />
      <stop offset="1" stop-color="#a855f7" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bg)" />
  <!-- OwOGG's brand mark — the word "OwO" (two round "O"s + a "w"), tilted diagonally, on the
       brand-gradient rounded hub — the same background treatment the original gamemoa icon
       used. The exact shape live-rendered by Header/Footer's <OwoWordmarkIcon>
       (apps/web/app/components/ui/OwoWordmarkIcon.tsx), not a redrawn approximation. The
       transform composes: rotate(-25, 24, 8) tilts the unrotated letterform around its own
       center, translate(-24,-8) + scale(...) + translate(256,256) then fits that rotated
       letterform into this 512 canvas — same order scripts/generate-favicon.ts computes in
       code (rotate first in letter-space, then center/scale the rotated bounding box). -->
  <g
    transform="translate(256,256) scale(7.4415404468312305) translate(-24,-8) rotate(-25,24,8)"
    fill="none"
    stroke="#ffffff"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <circle cx="8" cy="8" r="7" />
    <circle cx="40" cy="8" r="7" />
    <path d="M17 3l3.5 10 3.5-8 3.5 8 3.5-10" />
  </g>
</svg>
