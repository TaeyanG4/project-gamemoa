<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="OwOGG">
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1" />
      <stop offset="1" stop-color="#a855f7" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bg)" />
  <!-- OwOGG's brand mark — the exact shape live-rendered by Header/Footer's
       <OwoFaceIcon> (apps/web/app/components/ui/OwoFaceIcon.tsx, 24x24 viewBox), not a
       redrawn approximation. translate(64,64) scale(16) centers and fits it into this 512
       canvas at the same proportions as the header badge. stroke-width stays "2" (the
       component's native value) — the scale transform grows it proportionally, exactly
       like the live <OwoFaceIcon> render. -->
  <g
    transform="translate(64,64) scale(16)"
    fill="none"
    stroke="#ffffff"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <circle cx="7" cy="10" r="4" />
    <circle cx="17" cy="10" r="4" />
    <path d="M8 16l2 3 2-3 2 3 2-3" />
  </g>
</svg>
